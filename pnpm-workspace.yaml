packages:
  - "apps/*"
  - "packages/*"

allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  '@scarf/scarf': true
  esbuild: true
  prisma: true
  unrs-resolver: true

minimumReleaseAgeExclude:
  - '@supabase/auth-js@2.112.4'
  - '@supabase/functions-js@2.112.4'
  - '@supabase/postgrest-js@2.112.4'
  - '@supabase/realtime-js@2.112.4'
  - '@supabase/ssr@0.12.5'
  - '@supabase/storage-js@2.112.4'
  - '@supabase/supabase-js@2.112.4'

onlyBuiltDependencies:
  - "@nestjs/core"
  - "@prisma/client"
  - "@prisma/engines"
  - "@scarf/scarf"
  - esbuild
  - prisma
  - sharp
  - unrs-resolver
